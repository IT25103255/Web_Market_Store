<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0b2a20">
  <title>Admin | Online Market Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Schibsted+Grotesk:wght@600;700;800;900&amp;display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/theme.js"></script>
  <script src="js/enhance.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="side-brand">
      <span class="side-mark"><i class="fas fa-basket-shopping"></i></span>
      <div>Online Market<span class="side-sub">Admin control center</span></div>
    </div>
    <p class="side-label">Manage</p>
    <ul class="side-nav">
      <li><a class="active" href="#" data-view="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
      <li><a href="#" data-view="categories"><i class="fas fa-layer-group"></i> Categories</a></li>
      <li><a href="#" data-view="companies"><i class="fas fa-building"></i> Companies</a></li>
      <li><a href="#" data-view="products"><i class="fas fa-box-open"></i> Products</a></li>
      <li><a href="#" data-view="inventory"><i class="fas fa-boxes-stacked"></i> Inventory</a></li>
      <li><a href="#" data-view="promotions"><i class="fas fa-tags"></i> Promotions</a></li>
      <li><a href="#" data-view="orders"><i class="fas fa-receipt"></i> Orders</a></li>
      <li><a href="#" data-view="deliveries"><i class="fas fa-truck"></i> Deliveries</a></li>
      <li><a href="#" data-view="users"><i class="fas fa-users"></i> Users</a></li>
    </ul>
    <div class="side-footer">
      <div class="side-user">
        <span class="side-avatar"><i class="fas fa-user-shield"></i></span>
        <div><strong id="adminName"></strong><small>Administrator</small></div>
      </div>
      <a class="side-link" href="index.html"><i class="fas fa-store"></i> View Store</a>
      <a class="side-link side-logout" href="#" id="logout"><i class="fas fa-power-off"></i> Logout</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="viewTitle">Dashboard</h2>
        <small class="topbar-sub">SE2030 final project administration</small>
      </div>
      <div class="top-actions">
        <div class="admin-search"><i class="fas fa-search" aria-hidden="true"></i><input id="tableSearch" placeholder="Filter current view..." aria-label="Filter current view"></div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script><script src="js/admin.js"></script></body></html>
