spring.application.name=OnlineMarketStore
server.port=${SERVER_PORT:8080}

# Microsoft SQL Server - defaults use a dedicated fresh final-project database.
# These can be overridden with Windows environment variables without editing source code.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Online_market_system;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:market_user}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Existing schema: no automatic schema alteration is performed at application startup.
spring.jpa.hibernate.ddl-auto=none
# Preserve the exact SQL Server table/column names declared in @Table/@Column/@JoinColumn.
# Without this, Spring/Hibernate converts names such as StartDate to start_date,
# which does not match the supplied database schema.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# Keep the application as a normal embedded-Tomcat web application.
spring.main.web-application-type=servlet

spring.web.resources.cache.period=0
spring.jackson.serialization.write-dates-as-timestamps=false
